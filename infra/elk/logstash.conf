input {
  gelf {
    port => 12201
    use_udp => true
    use_tcp => false
  }
}

filter {
  mutate {
    add_field => { "environment" => "local" }
  }
  if [tag] {
    mutate {
      add_field => { "service" => "%{[tag]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shopping-cart-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
