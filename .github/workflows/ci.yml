name: Verify pull request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: shopping-cart-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
      DOCKERHUB_USERNAME: ci
      IMAGE_TAG: ${{ github.run_id }}
      TESTCONTAINERS_HOST_OVERRIDE: 127.0.0.1

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        working-directory: backend
        run: ./mvnw -ntp verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run test -- --configuration=ci
          npm run build

      - name: Build test images
        run: |
          docker build --tag "ci/shopping-cart-backend:${IMAGE_TAG}" backend
          docker build --tag "ci/shopping-cart-frontend:${IMAGE_TAG}" frontend

      - name: Start test environment
        run: docker compose -f compose.yml -f infra/ci/compose.yml up --detach --no-build postgresql backend frontend

      - name: Wait for application
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/management/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yml -f infra/ci/compose.yml ps
          exit 1

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e -- --config baseUrl=http://localhost:8088 --env apiUrl=http://localhost:8080

      - name: Clean up
        if: always()
        run: docker compose -f compose.yml -f infra/ci/compose.yml down --volumes --remove-orphans
