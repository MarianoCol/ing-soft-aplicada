name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release tag and source branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic versioning, for example v1.2.0" >&2
            exit 1
          fi
          git fetch origin master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD origin/master

      - name: Validate application version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          BASE_VERSION="${RELEASE_VERSION%%-*}"
          FRONTEND_VERSION="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' frontend/package.json | head -n 1)"
          BACKEND_VERSION="$(sed -n 's|^[[:space:]]*<version>\([^<]*\)</version>$|\1|p' backend/pom.xml | head -n 1)"
          if [[ "$FRONTEND_VERSION" != "$BASE_VERSION" || "$BACKEND_VERSION" != "$BASE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG must match frontend and backend version $BASE_VERSION" >&2
            exit 1
          fi

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required" >&2
            exit 1
          fi
          if [[ ! "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "Docker Hub namespace is invalid; configure the DOCKERHUB_NAMESPACE repository variable" >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build versioned images
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build --tag "$DOCKERHUB_NAMESPACE/shopping-cart-backend:$RELEASE_TAG" backend
          docker build --tag "$DOCKERHUB_NAMESPACE/shopping-cart-frontend:$RELEASE_TAG" frontend

      - name: Publish versioned images
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker push "$DOCKERHUB_NAMESPACE/shopping-cart-backend:$RELEASE_TAG"
          docker push "$DOCKERHUB_NAMESPACE/shopping-cart-frontend:$RELEASE_TAG"

      - name: Publish latest images
        if: ${{ !github.event.release.prerelease }}
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker tag "$DOCKERHUB_NAMESPACE/shopping-cart-backend:$RELEASE_TAG" "$DOCKERHUB_NAMESPACE/shopping-cart-backend:latest"
          docker tag "$DOCKERHUB_NAMESPACE/shopping-cart-frontend:$RELEASE_TAG" "$DOCKERHUB_NAMESPACE/shopping-cart-frontend:latest"
          docker push "$DOCKERHUB_NAMESPACE/shopping-cart-backend:latest"
          docker push "$DOCKERHUB_NAMESPACE/shopping-cart-frontend:latest"
